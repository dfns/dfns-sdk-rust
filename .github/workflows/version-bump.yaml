name: Version Bump

# Labels each PR with the release Semver Check computed, and commits that version to monorepo
# sync PRs, so merging one sync PR ships the SDK update and its version together. workflow_run
# always runs this file from the default branch, so a PR cannot change what runs with write
# access; the artifact it reads is validated by .github/scripts/validate-semver-result.sh.
#
# Setup: the version commit is made by the SDK release GitHub App, whose credentials live in the
# `sdk-release` environment (deployment restricted to main): variable RELEASE_APP_CLIENT_ID and
# secret RELEASE_APP_PRIVATE_KEY. A ruleset on sdk-sync/** branches lets only the sync app and the
# release app create or push them.

on:
  workflow_run:
    workflows:
      - Semver Check
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: version-bump-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  # dfnsco-dfns-sdk-sync[bot], which opens the monorepo sync PRs
  SYNC_APP_USER_ID: "275545256"

jobs:
  # All PRs: check the untrusted Semver Check result and the PR it belongs to
  validate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read # download the Semver Check artifact
    outputs:
      pr-number: ${{ steps.validate.outputs.pr-number }}
      head-sha: ${{ steps.validate.outputs.head-sha }}
      moved: ${{ steps.validate.outputs.moved }}
      published: ${{ steps.validate.outputs.published }}
      version: ${{ steps.validate.outputs.version }}
      level: ${{ steps.validate.outputs.level }}
      breaking: ${{ steps.validate.outputs.breaking }}
      current: ${{ steps.validate.outputs.current }}
      target: ${{ steps.validate.outputs.target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the Semver Check result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semver-result
          path: semver-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the result
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: .github/scripts/validate-semver-result.sh semver-result

  # Sync PRs only: commit the version, unless Cargo.toml already carries it.
  # The branch name is a pre-filter; commit-version.sh checks the PR comes from the sync app.
  commit-version:
    needs: validate
    if: >-
      needs.validate.outputs.moved == 'false' &&
      startsWith(github.event.workflow_run.head_branch, 'sdk-sync/') &&
      needs.validate.outputs.target != needs.validate.outputs.current
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment:
      name: sdk-release
      deployment: false
    permissions:
      contents: read # the commit is made with the release app's token, not GITHUB_TOKEN
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate the release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Commit the version
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr-number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ needs.validate.outputs.head-sha }}
          TARGET: ${{ needs.validate.outputs.target }}
        run: .github/scripts/commit-version.sh

  # All PRs: release labels, and a comment on breaking changes
  label:
    needs:
      - validate
      - commit-version
    # Runs whether commit-version ran, was skipped or failed
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.moved == 'false'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # release labels, comment, disable auto-merge
      actions: read # download the Semver Check artifact

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the Semver Check result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semver-result
          path: semver-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Label the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr-number }}
          LEVEL: ${{ needs.validate.outputs.level }}
          BREAKING: ${{ needs.validate.outputs.breaking }}
          VERSION: ${{ needs.validate.outputs.version }}
          PUBLISHED: ${{ needs.validate.outputs.published }}
          # When this run did not set the version: the version to set if the PR should be released
          SUGGEST_VERSION: >-
            ${{ needs.commit-version.outputs.committed != 'true' &&
            needs.validate.outputs.target != needs.validate.outputs.current &&
            needs.validate.outputs.target || '' }}
        run: .github/scripts/label-release.sh semver-result
