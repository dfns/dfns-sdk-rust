name: Version Bump

# Labels each PR with the release Semver Check computed, and commits that version to monorepo
# sync PRs, so merging one sync PR ships the SDK update and its version together. workflow_run
# always runs this file from the default branch, so a PR cannot change what runs with write
# access; the artifact it reads is validated by .github/scripts/validate-semver-result.sh.

on:
  workflow_run:
    workflows:
      - Semver Check
    types:
      - completed

permissions:
  contents: read

env:
  # dfnsco-dfns-sdk-sync[bot], which opens the monorepo sync PRs
  SYNC_APP_USER_ID: "275545256"
  # github-actions[bot], which makes the version commit
  ACTIONS_BOT_USER_ID: "41898282"

jobs:
  bump:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version to sync PR branches
      pull-requests: write # release labels, comment, disable auto-merge
      actions: read # download the Semver Check artifact
    concurrency:
      group: version-bump-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the Semver Check result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semver-result
          path: semver-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the result
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: .github/scripts/validate-semver-result.sh semver-result

      # Sync PRs only (opened by the sync app, see validate-semver-result.sh): commit the version,
      # unless Cargo.toml already carries it
      - name: Commit the version
        if: >-
          steps.validate.outputs.moved == 'false' &&
          steps.validate.outputs.is-sync == 'true' &&
          steps.validate.outputs.target != steps.validate.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ steps.validate.outputs.head-sha }}
          TARGET: ${{ steps.validate.outputs.target }}
        run: .github/scripts/commit-version.sh

      # All PRs: release labels, and a comment on breaking changes
      - name: Label the release
        if: steps.validate.outputs.moved == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.validate.outputs.pr-number }}
          LEVEL: ${{ steps.validate.outputs.level }}
          BREAKING: ${{ steps.validate.outputs.breaking }}
          VERSION: ${{ steps.validate.outputs.version }}
          PUBLISHED: ${{ steps.validate.outputs.published }}
          # Hand-written PRs: the version to set if the PR should be released
          SUGGEST_VERSION: >-
            ${{ steps.validate.outputs.is-sync != 'true' &&
            steps.validate.outputs.target != steps.validate.outputs.current &&
            steps.validate.outputs.target || '' }}
        run: .github/scripts/label-release.sh semver-result
