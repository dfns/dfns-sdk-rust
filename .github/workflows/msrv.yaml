name: MSRV

# Verifies the crate actually builds on its declared minimum supported Rust
# version (Cargo.toml `rust-version`). CI's other jobs float `@stable`, so
# without this the declared MSRV can silently rot (as 1.75 did). If a
# dependency raises the ecosystem floor above this, this job goes red — that
# is the signal to bump `rust-version` + the README badge + the value below.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust (MSRV — keep in sync with Cargo.toml rust-version)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Verify the crate builds on the declared MSRV
        run: cargo check --all-targets
