name: Semver Check

# Reports the release a PR requires, from its API change against the published crate, in the job
# summary. Read-only and informational: the version is set by the Prepare Release workflow.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_SEMVER_CHECKS_VERSION: "0.51.0"

jobs:
  semver:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-semver-checks
        run: cargo install --locked "cargo-semver-checks@$CARGO_SEMVER_CHECKS_VERSION"

      - name: Report the required release
        run: |
          published=$(curl -fsSL -A "dfns-sdk-rust CI (https://github.com/dfns/dfns-sdk-rust)" \
            https://crates.io/api/v1/crates/dfns-sdk-rust | jq -r .crate.max_stable_version)
          .github/scripts/next-version.sh "$published" semver-report.txt > semver-result.txt
          read -r version level breaking < semver-result.txt
          {
            echo "### Next release: \`$version\` ($level bump from \`$published\`)"
            if [ "$breaking" = "true" ]; then
              echo
              echo "Breaking change against the published crate:"
              echo '```'
              grep -E '^(--- failure|  )' semver-report.txt | head -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
